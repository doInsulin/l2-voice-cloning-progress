<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs><style>
    .title{font:700 38px Arial,sans-serif;fill:#17324d}.sub{font:400 20px Arial,sans-serif;fill:#536779}
    .h{font:700 21px Arial,sans-serif;fill:#fff}.rh{font:700 20px Arial,sans-serif;fill:#17324d}.t{font:400 17px Arial,sans-serif;fill:#324b5f}.f{font:600 17px Arial,sans-serif;fill:#fff}
  </style></defs>
  <rect width="1600" height="900" fill="#f7fafc"/>
  <text x="800" y="60" text-anchor="middle" class="title">Evidence synthesis across reference-cue classes</text>
  <text x="800" y="94" text-anchor="middle" class="sub">Magnitude, consistency, and generalizability are reported separately—not as a one-dimensional hierarchy</text>
  <rect x="55" y="135" width="1490" height="65" rx="12" fill="#17324d"/>
  <text x="195" y="176" text-anchor="middle" class="h">Cue class</text><text x="590" y="176" text-anchor="middle" class="h">Transfer magnitude</text><text x="990" y="176" text-anchor="middle" class="h">Consistency</text><text x="1370" y="176" text-anchor="middle" class="h">Generalizability</text>
  <line x1="365" y1="135" x2="365" y2="725" stroke="#fff" stroke-opacity=".55" stroke-width="2"/><line x1="790" y1="135" x2="790" y2="725" stroke="#fff" stroke-opacity=".55" stroke-width="2"/><line x1="1190" y1="135" x2="1190" y2="725" stroke="#fff" stroke-opacity=".55" stroke-width="2"/>

  <rect x="55" y="215" width="1490" height="155" rx="12" fill="#e8f2f7" stroke="#8cb6c9" stroke-width="2"/>
  <rect x="55" y="215" width="310" height="155" rx="12" fill="#cfe6ef"/>
  <text x="80" y="260" class="rh">Global acoustic-style cue</text><text x="80" y="294" class="t">Voiced-F0 range</text>
  <text x="395" y="264" class="t">Strong under the tested</text><text x="395" y="291" class="t">range manipulation</text>
  <text x="820" y="251" class="t">91/95 triplets monotonic;</text><text x="820" y="278" class="t">16/16 speaker means positive</text>
  <text x="1220" y="251" class="t">F5 primary;</text><text x="1220" y="278" class="t">Qwen supporting pattern</text>

  <rect x="55" y="390" width="1490" height="155" rx="12" fill="#e9f5f2" stroke="#8bc4bb" stroke-width="2"/>
  <rect x="55" y="390" width="310" height="155" rx="12" fill="#d2ebe6"/>
  <text x="80" y="435" class="rh">Local structured phonetic cue</text><text x="80" y="469" class="t">Vowel F1/F2 trajectory</text>
  <text x="395" y="439" class="t">Partial / attenuated</text>
  <text x="820" y="426" class="t">F5: consistent in EH and IH;</text><text x="820" y="453" class="t">Qwen: unstable in tested cells</text>
  <text x="1220" y="426" class="t">Differed across tested systems;</text><text x="1220" y="453" class="t">stimulus- and interface-limited</text>

  <rect x="55" y="565" width="1490" height="160" rx="12" fill="#fff2e8" stroke="#e1ad87" stroke-width="2"/>
  <rect x="55" y="565" width="310" height="160" rx="12" fill="#f6dfcf"/>
  <text x="80" y="610" class="rh">Context-dependent temporal cue</text><text x="80" y="644" class="t">Equal-frame local timing</text>
  <text x="395" y="614" class="t">Small and</text><text x="395" y="641" class="t">measurement-sensitive</text>
  <text x="820" y="601" class="t">4/72 MFA interval triplets</text><text x="820" y="628" class="t">monotonic; heterogeneous</text>
  <text x="1220" y="601" class="t">F5 primary;</text><text x="1220" y="628" class="t">Qwen supporting relative pattern</text>

  <rect x="55" y="770" width="1490" height="82" rx="14" fill="#17324d"/>
  <text x="800" y="820" text-anchor="middle" class="f">Output-level evidence only · Different manipulations and response scales · No pure architecture effect</text>
</svg>
