<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="380" viewBox="0 0 1050 380" role="img" aria-labelledby="t d"><title id="t">Final segmental matched DID</title><desc id="d">EH positive with CI above zero; IH confidence interval crosses zero.</desc><style>text{font-family:Arial,Helvetica,sans-serif;fill:#202124} .small{font-size:14px} .tick{font-size:13px;fill:#555} .label{font-size:17px;font-weight:600} .title{font-size:22px;font-weight:700} .muted{fill:#60646a} .axis{stroke:#45494d;stroke-width:1.5} .grid{stroke:#e0e2e4;stroke-width:1} .ink{fill:#202124} .teal{fill:#147d78} .gold{fill:#a3691b}</style><text x="40" y="46" class="title">Matched vowel reconstruction: canonical direction</text><text x="40" y="75" class="small muted">F5-TTS · positive DID means greater error-token movement toward the speaker-specific canonical endpoint than correct controls</text><text x="42" y="167" class="label">EH→AE</text><text x="42" y="191" class="small muted">39 pairs · 11 speakers</text><line x1="538.3" x2="791.7" y1="162" y2="162" stroke="#202124" stroke-width="3"/><circle cx="650.1" cy="162" r="7" fill="#147d78"/><text x="830" y="167" class="small">+0.798 [0.167, 1.597]</text><text x="42" y="272" class="label">IH→IY</text><text x="42" y="296" class="small muted">56 pairs · 14 speakers</text><line x1="451.8" x2="749.3" y1="267" y2="267" stroke="#202124" stroke-width="3"/><circle cx="599.2" cy="267" r="7" fill="#147d78"/><text x="830" y="272" class="small">+0.511 [-0.320, 1.358]</text><line x1="508.6" x2="508.6" y1="112" y2="290" stroke="#999" stroke-dasharray="5 5"/><text x="42" y="345" class="small muted">Zero line indicates no matched directional difference. EH supports acoustic reconstruction; IH remains uncertain.</text></svg>