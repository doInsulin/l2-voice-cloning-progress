<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="485" viewBox="0 0 1050 485" role="img" aria-labelledby="t d"><title id="t">Selective preservation synthesis</title><desc id="d">Separate output-level patterns for identity proxy, F0, local timing, and vowel realization.</desc><style>text{font-family:Arial,Helvetica,sans-serif;fill:#202124} .small{font-size:14px} .tick{font-size:13px;fill:#555} .label{font-size:17px;font-weight:600} .title{font-size:22px;font-weight:700} .muted{fill:#60646a} .axis{stroke:#45494d;stroke-width:1.5} .grid{stroke:#e0e2e4;stroke-width:1} .ink{fill:#202124} .teal{fill:#147d78} .gold{fill:#a3691b}</style><text x="42" y="45" class="title">Selective preservation is an output pattern</text><rect x="42" y="98" width="210" height="75" fill="#ededed" stroke="#202124"/><text x="64" y="129" class="label">Reference speech</text><text x="64" y="152" class="small">+ target text</text><line x1="252" x2="323" y1="135" y2="135" stroke="#202124" stroke-width="2"/><polygon points="323,135 314,129 314,141" fill="#202124"/><rect x="323" y="98" width="210" height="75" fill="#ededed" stroke="#202124"/><text x="349" y="129" class="label">Cloning system</text><text x="349" y="152" class="small">fixed target / conditions</text><line x1="533" x2="594" y1="135" y2="108" stroke="#777" stroke-width="1.5"/><rect x="594" y="77" width="414" height="53" fill="#f4f4f4"/><text x="608" y="99" class="label">ECAPA identity cues</text><text x="608" y="120" class="small muted">retained imperfectly</text><line x1="533" x2="594" y1="135" y2="175" stroke="#777" stroke-width="1.5"/><rect x="594" y="144" width="414" height="53" fill="#e1f0ee"/><text x="608" y="166" class="label">F0 range</text><text x="608" y="187" class="small muted">strong reference response</text><line x1="533" x2="594" y1="135" y2="242" stroke="#777" stroke-width="1.5"/><rect x="594" y="211" width="414" height="53" fill="#f4f4f4"/><text x="608" y="233" class="label">Internal word gap</text><text x="608" y="254" class="small muted">weak reference response</text><line x1="533" x2="594" y1="135" y2="309" stroke="#777" stroke-width="1.5"/><rect x="594" y="278" width="414" height="53" fill="#f4f4f4"/><text x="608" y="300" class="label">EH→AE vowel shift</text><text x="608" y="321" class="small muted">canonical-direction acoustic movement</text><line x1="533" x2="594" y1="135" y2="376" stroke="#777" stroke-width="1.5"/><rect x="594" y="345" width="414" height="53" fill="#e1f0ee"/><text x="608" y="367" class="label">Local vowel cues</text><text x="608" y="388" class="small muted">partial, model-dependent response</text></svg>