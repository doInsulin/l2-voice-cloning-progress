rgets · 11 speakers</text><line x1="503.1" x2="746.3" y1="366" y2="366" stroke="#202124" stroke-width="3"/><circle cx="626.2" cy="366" r="7" fill="#a3691b"/><text x="870" y="371" class="small">-0.010</text><text x="42" y="472" class="small muted">These local vowel slopes are distinct from natural preservation NDS and the matched canonical-axis DID.</text></svg>